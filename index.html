<!DOCTYPE html>
<html lang="sv" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Armeniska Duo • Svenska till Armeniska</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <section id="homePage" class="page active" aria-label="Hem">
      <header class="topbar">
        <h1>Armeniska Duo</h1>
        <button id="themeToggle" class="ghost-btn" type="button">Mörkt läge</button>
      </header>

      <article class="card course-card">
        <p class="eyebrow">Svenska → Armeniska</p>
        <h2>Unit 1</h2>
        <p>Hälsningar och vardagliga fraser.</p>
        <div class="meta-row">
          <span>Streak: <strong id="streak">1</strong></span>
          <span>XP: <strong id="xp">0</strong></span>
          <span>Gems: <strong id="gems">0</strong></span>
        </div>
        <button id="enterUnitBtn" class="primary-btn" type="button">Starta Unit 1</button>
      </article>

      <article class="card">
        <h3>Tryckbara ord</h3>
        <p class="muted">Alla ord har prickad underline och kan tryckas för översättning.</p>
        <div id="unitWords" class="unit-words"></div>
      </article>
    </section>

    <section id="unitPage" class="page" aria-label="Unit 1">
      <header class="topbar unit-topbar">
        <button id="quitUnitBtn" class="ghost-btn" type="button">Avsluta Unit</button>
        <div class="unit-status">
          <span id="questionCounter">1 / 10</span>
          <span id="timerText">00:00</span>
        </div>
      </header>

      <article class="card question-card">
        <p class="translate-label">Översätt</p>

        <div class="speech-row">
          <div class="avatar" aria-hidden="true">🧑</div>
          <div class="speech-bubble">
            <button id="armenianWordBtn" class="armenian-word" type="button">Բարև</button>
            <p id="wordMeaning" class="word-meaning" hidden>hej</p>
          </div>
        </div>

        <p id="hint" class="hint"></p>
        <button id="nextBtn" class="primary-btn" type="button" disabled>Nästa</button>
        <p id="feedback" class="feedback" aria-live="polite"></p>
      </article>
    </section>
  </main>

  <div id="entryOverlay" class="overlay" hidden>
    <div class="overlay-card">
      <p>Öppnar Unit 1…</p>
      <div class="load-track"><div id="loadFill" class="load-fill"></div></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
